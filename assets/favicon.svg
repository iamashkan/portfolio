<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashkan Aghamoali — wireframe mesh face">
  <defs>
    <linearGradient id="mesh" x1="14" y1="9" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="1" stop-color="#46d6c4"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#131c33"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#5aa2ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5aa2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>

  <!-- low-poly face mesh -->
  <g filter="url(#glow)">
    <g fill="url(#mesh)" fill-opacity=".13" stroke="url(#mesh)" stroke-width="1"
       stroke-linejoin="round" stroke-linecap="round">
      <polygon points="32,9 18,16 24,26"/>
      <polygon points="32,9 24,26 40,26"/>
      <polygon points="32,9 40,26 46,16"/>
      <polygon points="18,16 15,32 24,26"/>
      <polygon points="46,16 49,32 40,26"/>
      <polygon points="24,26 15,32 32,36"/>
      <polygon points="24,26 32,36 40,26"/>
      <polygon points="40,26 49,32 32,36"/>
      <polygon points="15,32 20,45 32,36"/>
      <polygon points="49,32 44,45 32,36"/>
      <polygon points="32,36 20,45 32,44"/>
      <polygon points="32,36 32,44 44,45"/>
      <polygon points="20,45 32,55 32,44"/>
      <polygon points="44,45 32,44 32,55"/>
    </g>

    <!-- vertex nodes -->
    <g fill="#cfeaff">
      <circle cx="32" cy="9" r="1.6"/>
      <circle cx="18" cy="16" r="1.4"/>
      <circle cx="46" cy="16" r="1.4"/>
      <circle cx="15" cy="32" r="1.4"/>
      <circle cx="49" cy="32" r="1.4"/>
      <circle cx="24" cy="26" r="1.8"/>
      <circle cx="40" cy="26" r="1.8"/>
      <circle cx="32" cy="36" r="1.6"/>
      <circle cx="20" cy="45" r="1.4"/>
      <circle cx="44" cy="45" r="1.4"/>
      <circle cx="32" cy="44" r="1.4"/>
      <circle cx="32" cy="55" r="1.6"/>
    </g>
  </g>
</svg>
